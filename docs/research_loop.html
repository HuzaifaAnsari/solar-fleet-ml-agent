<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f5ea;
      --color-ink:    #221811;
      --color-muted:  #5e534a;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-title:   'Bricolage Grotesque', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 700;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · solar-fleet-ml-agent</p>
    <h1>The research loop, and the score it optimises</h1>

    <svg viewBox="0 0 960 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="research-loop-title research-loop-desc">
      <title id="research-loop-title">The research loop, and the score it optimises</title>
      <desc id="research-loop-desc">An agent changes one idea in experiment.py, the fixed harness scores it on plants whose faults it never trained on, using only windows from the same stretch of each run, a gate keeps or discards the change, and once the stop rule fires the winner is scored a single time on a locked test set, where no change beat the published model: time-matched unseen-plant macro-F1 0.46.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5e534a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d24e3e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f5ea"/>

      <!-- ARROWS (drawn before nodes) -->
      <line x1="152" y1="140" x2="188" y2="140" stroke="#5e534a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="352" y1="140" x2="388" y2="140" stroke="#5e534a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="592" y1="140" x2="628" y2="140" stroke="#5e534a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="712" y1="140" x2="756" y2="140" stroke="#5e534a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="672" y1="180" x2="672" y2="236" stroke="#5e534a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- returns: next idea -->
      <path d="M 844 112 L 844 72 Q 844 64 836 64 L 280 64 Q 272 64 272 72 L 272 108" fill="none" stroke="#5e534a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 592 268 L 280 268 Q 272 268 272 260 L 272 172" fill="none" stroke="#5e534a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- exit -->
      <line x1="672" y1="296" x2="672" y2="372" stroke="#d24e3e" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ARROW LABELS -->
      <rect x="720" y="120" width="32" height="12" rx="2" fill="#f9f5ea"/>
      <text x="736" y="128" fill="#786c63" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>
      <rect x="684" y="196" width="32" height="12" rx="2" fill="#f9f5ea"/>
      <text x="700" y="204" fill="#786c63" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>
      <rect x="684" y="320" width="56" height="12" rx="2" fill="#f9f5ea"/>
      <text x="712" y="328" fill="#786c63" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STOP RULE</text>
      <text x="684" y="344" fill="#786c63" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.04em">40 runs, or 10 fails in a row</text>
      <!-- gate criteria -->
      <text x="672" y="88" fill="#786c63" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.04em">F1 +0.01 · worst recall ≥ · late false alarms ≤</text>

      <!-- NODES -->
      <!-- A: input -->
      <rect x="32" y="112" width="120" height="56" rx="6" fill="#f9f5ea"/>
      <rect x="32" y="112" width="120" height="56" rx="6" fill="rgba(94,83,74,0.10)" stroke="#786c63" stroke-width="1"/>
      <text x="92" y="138" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Agent rules</text>
      <text x="92" y="154" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">program.md</text>

      <!-- B: step -->
      <rect x="192" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#221811" stroke-width="1"/>
      <text x="272" y="138" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Change one idea</text>
      <text x="272" y="154" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">src/experiment.py</text>

      <!-- C: focal scorer -->
      <rect x="392" y="104" width="200" height="72" rx="6" fill="#f9f5ea"/>
      <rect x="392" y="104" width="200" height="72" rx="6" fill="rgba(251,131,113,0.16)" stroke="#d24e3e" stroke-width="1.2"/>
      <text x="492" y="128" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Score unseen plants</text>
      <text x="492" y="144" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">prepare.py · validation only</text>
      <text x="492" y="160" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">time-matched: late windows only</text>

      <!-- D: gate -->
      <polygon points="672,100 712,140 672,180 632,140" fill="#ffffff" stroke="#221811" stroke-width="1"/>
      <text x="672" y="144" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Gate</text>

      <!-- E: keep -->
      <rect x="760" y="112" width="168" height="56" rx="6" fill="#ffffff" stroke="#221811" stroke-width="1"/>
      <text x="844" y="138" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">New base</text>
      <text x="844" y="154" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">change kept</text>

      <!-- F: discard -->
      <rect x="592" y="240" width="160" height="56" rx="6" fill="#ffffff" stroke="#221811" stroke-width="1"/>
      <text x="672" y="266" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Restore base</text>
      <text x="672" y="282" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">change thrown away</text>

      <!-- I: focal locked test -->
      <rect x="552" y="376" width="240" height="80" rx="6" fill="#f9f5ea"/>
      <rect x="552" y="376" width="240" height="80" rx="6" fill="rgba(251,131,113,0.16)" stroke="#d24e3e" stroke-width="1.2"/>
      <text x="672" y="400" fill="#221811" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Locked test, once per model</text>
      <text x="672" y="416" fill="#5e534a" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">final_test.py · after the loop stops</text>
      <text x="672" y="440" fill="#d24e3e" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">best: published model · F1 0.46</text>

      <!-- CALLOUT: the trap -->
      <text x="32" y="324" fill="#786c63" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">WHY UNSEEN PLANTS, TIME-MATCHED</text>
      <text fill="#221811" font-size="14" font-style="italic" font-family="'Inter', sans-serif">
        <tspan x="32" y="348">Loop 1 learned which plant, not which fault:</tspan>
        <tspan x="32" y="368">0.80 → 0.91 on known plants, 0.19 on new.</tspan>
        <tspan x="32" y="388">Loop 2 learned which moment: late healthy</tspan>
        <tspan x="32" y="408">windows were called a fault 78–94% of the time.</tspan>
      </text>

      <!-- LEGEND -->
      <line x1="32" y1="476" x2="928" y2="476" stroke="rgba(34,24,17,0.12)" stroke-width="0.8"/>
      <text x="32" y="500" fill="#5e534a" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="492" width="20" height="12" rx="2" fill="#ffffff" stroke="#221811" stroke-width="1"/>
      <text x="140" y="500" fill="#5e534a" font-size="8" font-family="'JetBrains Mono', monospace">step</text>
      <rect x="196" y="492" width="20" height="12" rx="2" fill="rgba(94,83,74,0.10)" stroke="#786c63" stroke-width="1"/>
      <text x="224" y="500" fill="#5e534a" font-size="8" font-family="'JetBrains Mono', monospace">input</text>
      <rect x="284" y="492" width="20" height="12" rx="2" fill="rgba(251,131,113,0.16)" stroke="#d24e3e" stroke-width="1.2"/>
      <text x="312" y="500" fill="#5e534a" font-size="8" font-family="'JetBrains Mono', monospace">focal: what makes it honest</text>
      <polygon points="476,490 484,498 476,506 468,498" fill="#ffffff" stroke="#221811" stroke-width="1"/>
      <text x="492" y="500" fill="#5e534a" font-size="8" font-family="'JetBrains Mono', monospace">decision</text>
      <line x1="560" y1="496" x2="592" y2="496" stroke="#5e534a" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="600" y="500" fill="#5e534a" font-size="8" font-family="'JetBrains Mono', monospace">back to the next idea</text>
    </svg>
  </div>
</body>
</html>
